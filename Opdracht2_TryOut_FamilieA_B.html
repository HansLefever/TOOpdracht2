<style>
:root{--green:#85d148;--text:#f5f7f2;--muted:#99a595;--panel:#0d120d;--line:#253025}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}
body{min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1px),radial-gradient(circle at 75% 70%,#fff 0 1px,transparent 1px);background-size:4px 4px,5px 5px;mix-blend-mode:screen}
.screen{display:none;min-height:100dvh;padding:20px}
.screen.active{display:flex}
#countdown{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at center,rgba(76,140,43,.18),transparent 43%),#000}
.task{font-size:clamp(2rem,8vw,4rem);letter-spacing:.18em;text-transform:uppercase;font-weight:900}
.count{font-size:clamp(7rem,32vw,15rem);font-weight:900;color:var(--green);line-height:1;margin-top:20px;text-shadow:0 0 40px rgba(133,209,72,.30)}
.pulse{animation:pulse .75s ease}
@keyframes pulse{0%{opacity:0;transform:scale(.62)}45%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.app{width:min(100%,760px);margin:auto;display:flex;flex-direction:column;justify-content:center}
.header{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{color:var(--green);font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;font-weight:900}
.counter{color:var(--muted)}
.progress{height:5px;background:#182018;border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:linear-gradient(90deg,#4d8f2d,var(--green));width:0;transition:width .45s cubic-bezier(.22,.61,.36,1);box-shadow:0 0 12px rgba(133,209,72,.35)}
.card{background:linear-gradient(180deg,rgba(17,24,17,.98),rgba(10,14,10,.98));border:1px solid var(--line);border-radius:22px;padding:24px 20px;min-height:430px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 36px rgba(133,209,72,.07)}
.kicker{color:var(--green);letter-spacing:.18em;text-transform:uppercase;font-size:.75rem;font-weight:900}
.question{font-size:clamp(1.45rem,5vw,2.1rem);line-height:1.2;margin:15px 0 24px}
.options{display:grid;gap:12px;margin-top:auto}
.option{display:flex;gap:12px;padding:15px 16px;background:#111811;border:1px solid var(--line);border-radius:14px;font-size:1.05rem}
.letter{color:var(--green);font-weight:900;min-width:1.3em}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
button{border:0;border-radius:14px;padding:15px;font-size:1rem;font-weight:900;min-height:52px;transition:transform .12s ease,filter .12s ease}
button:active{transform:scale(.98);filter:brightness(.92)}
.primary{background:var(--green);color:#071007}
.secondary{background:#182018;color:var(--text)}
button:disabled{opacity:.35}
.note,.version{color:var(--muted);text-align:center;font-size:.84rem}
.version{margin-top:8px}
#content{transition:opacity .28s ease,transform .28s cubic-bezier(.22,.61,.36,1);will-change:transform,opacity}
.fade-left{opacity:0;transform:translateX(-34px)}
.fade-right{opacity:0;transform:translateX(34px)}
#finish{align-items:center;justify-content:center;text-align:center}
.finish-box{width:min(100%,620px);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px 22px}
.finish-box h1{font-size:clamp(2rem,8vw,3.4rem)}
.full{width:100%;margin-top:12px}
@media(max-width:420px){
  .screen{padding:14px}
  .card{min-height:400px;padding:20px 16px}
  .question{font-size:1.38rem}
  .option{font-size:1rem;padding:14px}
  .nav{gap:10px}
}
@media(max-height:680px){
  .card{min-height:360px}
  .question{margin-bottom:16px}
  .option{padding:12px 14px}
}
</style>
</head>

<script>
'use strict';

/* =========================================================
   VRAGEN EN ANTWOORDEN AANPASSEN
   Wijzig hieronder enkel de teksten tussen aanhalingstekens.
   ========================================================= */
const OPDRACHT = {"titel": "Opdracht 2 · Try-Out", "versie": "Try-Out 1.0", "decoder_url": "https://hanslefever.github.io/Decoder/", "teams": {"A": {"naam": "Familie A · Camille & Jelle", "vragen": [{"vraag": "Welke hobby's noemt Margaux?", "A": "Wandelen, tekenen en lezen", "B": "Padel, tafeltennis en gamen", "C": "Voetbal, koken en schaken", "D": "Karting, lopen en lezen", "correct": "A"}, {"vraag": "Wie denkt Margaux dat de Mol zal zijn?", "A": "Jelle", "B": "Remy", "C": "Camille", "D": "Margaux", "correct": "C"}, {"vraag": "Waar is Margaux opvallend goed in?", "A": "Vlaggen van de wereld herkennen", "B": "Data onthouden", "C": "Karting", "D": "Haar tong oprollen", "correct": "B"}, {"vraag": "Wat is Margaux' grootste guilty pleasure?", "A": "Snoep eten", "B": "Vlogs kijken op YouTube", "C": "FC De Kampioenen kijken", "D": "True Crime", "correct": "D"}, {"vraag": "Wat wil Margaux zeker in 2027 kunnen?", "A": "12 km lopen", "B": "Een koersfiets kopen", "C": "Haar PR op 5 km verbeteren", "D": "Opnieuw naar Zuid-Afrika reizen", "correct": "A"}, {"vraag": "Welke hobby's noemt Remy?", "A": "Padel, tv-kijken en wandelen", "B": "Voetbal, koken, schaken, lopen en lezen", "C": "Karting, gamen en tafeltennis", "D": "Tekenen, lezen en wandelen", "correct": "B"}, {"vraag": "Waar is Remy opvallend goed in?", "A": "Veel vlaggen van de wereld kennen", "B": "Verjaardagen onthouden", "C": "Karting", "D": "Mensen overtuigen", "correct": "A"}, {"vraag": "Wat is Remy's grootste guilty pleasure?", "A": "True Crime", "B": "FC De Kampioenen kijken", "C": "Snoep eten", "D": "Vlogs kijken op YouTube", "correct": "C"}, {"vraag": "Wat kiest Remy: een vrijstelling voor zichzelf of €1.000 voor de groepspot?", "A": "€1.000 voor de groepspot", "B": "Vrijstelling", "C": "Hij laat de groep kiezen", "D": "Hij twijfelt tot het einde", "correct": "B"}, {"vraag": "Welke eigenschap zou Remy volgens zichzelf een goede Mol maken?", "A": "Chaotisch overkomen", "B": "Op de achtergrond blijven", "C": "Zich van de domme houden", "D": "Rust kunnen bewaren", "correct": "D"}]}, "B": {"naam": "Familie B · Margaux & Remy", "vragen": [{"vraag": "Welke hobby noemt Camille?", "A": "Wandelen", "B": "Padel", "C": "Karting", "D": "Schaken", "correct": "B"}, {"vraag": "Wie denkt Camille dat de Mol zal zijn?", "A": "Remy", "B": "Jelle", "C": "Margaux", "D": "Camille", "correct": "A"}, {"vraag": "Wat is Camille's grootste guilty pleasure?", "A": "True Crime", "B": "Snoep eten", "C": "Vlogs kijken op YouTube", "D": "FC De Kampioenen kijken", "correct": "C"}, {"vraag": "Wat kiest Camille: een vrijstelling voor zichzelf of €1.000 voor de groepspot?", "A": "Vrijstelling", "B": "€1.000 voor de groepspot", "C": "Ze laat de groep kiezen", "D": "Ze kiest willekeurig", "correct": "B"}, {"vraag": "Wat is volgens Camille haar minst goede karaktertrek?", "A": "Gierigheid", "B": "Snel geërgerd raken", "C": "Ongeduld", "D": "Koppigheid", "correct": "C"}, {"vraag": "Welke hobby's noemt Jelle?", "A": "Padel, tafeltennis, karting en gamen", "B": "Voetbal, koken, schaken en lopen", "C": "Wandelen, tekenen en lezen", "D": "Padel en tv-kijken", "correct": "A"}, {"vraag": "Waar is Jelle opvallend goed in?", "A": "Data onthouden", "B": "Karting", "C": "Vlaggen herkennen", "D": "Tafeltennis", "correct": "B"}, {"vraag": "Wat is Jelle's grootste guilty pleasure?", "A": "FC De Kampioenen kijken", "B": "True Crime", "C": "Snoep eten", "D": "Vlogs kijken op YouTube", "correct": "A"}, {"vraag": "Wat staat op Jelle's bucketlist voor 2027?", "A": "12 km kunnen lopen", "B": "Een verre reis maken", "C": "Een koersfiets kopen", "D": "Een PR op 5 km lopen", "correct": "C"}, {"vraag": "Welke eigenschap zou Jelle volgens zichzelf een goede Mol maken?", "A": "Hij kan rust bewaren", "B": "Hij blijft liever op de achtergrond", "C": "Hij kan zich van de domme houden", "D": "Hij komt chaotisch over", "correct": "B"}]}}};
/* ================= EINDE VRAGENBLOK ================= */

const params = new URLSearchParams(window.location.search);
const rawTeam = (params.get('team') || 'A').toLowerCase();
const teamAliases = {
  'a':'A','familiea':'A','familie-a':'A',
  'b':'B','familieb':'B','familie-b':'B'
};
const teamKey = teamAliases[rawTeam] || 'A';
const team = OPDRACHT.teams[teamKey] || OPDRACHT.teams.A;
let index = 0;

const countdown = document.getElementById('countdown');
const quiz = document.getElementById('quiz');
const finish = document.getElementById('finish');
const countNumber = document.getElementById('countNumber');
const brand = document.getElementById('brand');
const counter = document.getElementById('counter');
const bar = document.getElementById('bar');
const content = document.getElementById('content');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const relay = document.getElementById('relay');

brand.textContent = 'De Mol · ' + team.naam;

function show(screen) {
  countdown.classList.remove('active');
  quiz.classList.remove('active');
  finish.classList.remove('active');
  screen.classList.add('active');
}

function pulseNumber(value) {
  countNumber.textContent = value;
  countNumber.classList.remove('pulse');
  void countNumber.offsetWidth;
  countNumber.classList.add('pulse');
}

function feedback() {
  if ('vibrate' in navigator) navigator.vibrate(35);
  try {
    relay.pause();
    relay.currentTime = 0;
    relay.volume = 0.85;
    relay.play().catch(function() {});
  } catch (error) {}
}

function render(direction) {
  content.classList.add(direction > 0 ? 'fade-right' : 'fade-left');

  window.setTimeout(function() {
    const q = team.vragen[index];
    const letters = ['A','B','C','D'];

    content.innerHTML =
      '<div class="kicker">Vraag ' + (index + 1) + '</div>' +
      '<h1 class="question">' + q.vraag + '</h1>' +
      '<div class="options">' +
      letters.map(function(letter) {
        return '<div class="option"><span class="letter">' + letter +
          '</span><span>' + q[letter] + '</span></div>';
      }).join('') +
      '</div>';

    content.classList.remove('fade-left', 'fade-right');
    counter.textContent = (index + 1) + ' / ' + team.vragen.length;
    bar.style.width = ((index + 1) / team.vragen.length * 100) + '%';
    prev.disabled = index === 0;
    next.textContent = index === team.vragen.length - 1
      ? 'Naar eindscherm →'
      : 'Volgende →';
  }, 220);
}

prev.addEventListener('click', function() {
  if (index > 0) {
    feedback();
    index -= 1;
    render(-1);
  }
});

next.addEventListener('click', function() {
  feedback();
  if (index < team.vragen.length - 1) {
    index += 1;
    render(1);
  } else {
    show(finish);
  }
});

document.getElementById('back').addEventListener('click', function() {
  feedback();
  index = team.vragen.length - 1;
  show(quiz);
  render(-1);
});

document.getElementById('decoder').addEventListener('click', function() {
  feedback();
  window.location.href = OPDRACHT.decoder_url;
});

function beginCountdown() {
  pulseNumber('3');

  window.setTimeout(function() {
    pulseNumber('2');

    window.setTimeout(function() {
      pulseNumber('1');

      window.setTimeout(function() {
        pulseNumber('START');

        window.setTimeout(function() {
          show(quiz);
          render(1);
        }, 650);
      }, 1000);
    }, 1000);
  }, 1000);
}

window.addEventListener('DOMContentLoaded', beginCountdown);
</script>
</body>
</html>
