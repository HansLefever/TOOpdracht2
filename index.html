<style>
:root{--green:#85d148;--text:#f5f7f2;--muted:#99a595;--panel:#0d120d;--line:#253025}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}
body{min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1px),radial-gradient(circle at 75% 70%,#fff 0 1px,transparent 1px);background-size:4px 4px,5px 5px;mix-blend-mode:screen}
.screen{display:none;min-height:100dvh;padding:20px}
.screen.active{display:flex}
#countdown{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at center,rgba(76,140,43,.18),transparent 43%),#000}
.task{font-size:clamp(2rem,8vw,4rem);letter-spacing:.18em;text-transform:uppercase;font-weight:900}
.count{font-size:clamp(7rem,32vw,15rem);font-weight:900;color:var(--green);line-height:1;margin-top:20px;text-shadow:0 0 40px rgba(133,209,72,.30)}
.pulse{animation:pulse .75s ease}
@keyframes pulse{0%{opacity:0;transform:scale(.62)}45%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.app{width:min(100%,760px);margin:auto;display:flex;flex-direction:column;justify-content:center}
.header{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{color:var(--green);font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;font-weight:900}
.counter{color:var(--muted)}
.progress{height:5px;background:#182018;border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:linear-gradient(90deg,#4d8f2d,var(--green));width:0;transition:width .45s cubic-bezier(.22,.61,.36,1);box-shadow:0 0 12px rgba(133,209,72,.35)}
.card{background:linear-gradient(180deg,rgba(17,24,17,.98),rgba(10,14,10,.98));border:1px solid var(--line);border-radius:22px;padding:24px 20px;min-height:430px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 36px rgba(133,209,72,.07)}
.kicker{color:var(--green);letter-spacing:.18em;text-transform:uppercase;font-size:.75rem;font-weight:900}
.question{font-size:clamp(1.45rem,5vw,2.1rem);line-height:1.2;margin:15px 0 24px}
.options{display:grid;gap:12px;margin-top:auto}
.option{display:flex;gap:12px;padding:15px 16px;background:#111811;border:1px solid var(--line);border-radius:14px;font-size:1.05rem}
.letter{color:var(--green);font-weight:900;min-width:1.3em}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
button{border:0;border-radius:14px;padding:15px;font-size:1rem;font-weight:900;min-height:52px;transition:transform .12s ease,filter .12s ease}
button:active{transform:scale(.98);filter:brightness(.92)}
.primary{background:var(--green);color:#071007}
.secondary{background:#182018;color:var(--text)}
button:disabled{opacity:.35}
.note,.version{color:var(--muted);text-align:center;font-size:.84rem}
.version{margin-top:8px}
#content{transition:opacity .28s ease,transform .28s cubic-bezier(.22,.61,.36,1);will-change:transform,opacity}
.fade-left{opacity:0;transform:translateX(-34px)}
.fade-right{opacity:0;transform:translateX(34px)}
#finish{align-items:center;justify-content:center;text-align:center}
.finish-box{width:min(100%,620px);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px 22px}
.finish-box h1{font-size:clamp(2rem,8vw,3.4rem)}
.full{width:100%;margin-top:12px}
@media(max-width:420px){
  .screen{padding:14px}
  .card{min-height:400px;padding:20px 16px}
  .question{font-size:1.38rem}
  .option{font-size:1rem;padding:14px}
  .nav{gap:10px}
}
@media(max-height:680px){
  .card{min-height:360px}
  .question{margin-bottom:16px}
  .option{padding:12px 14px}
}
</style>
</head>

<script>
'use strict';

/* =========================================================
   VRAGEN EN ANTWOORDEN AANPASSEN
   Wijzig hieronder enkel de teksten tussen aanhalingstekens.

const OPDRACHT = {"titel":"Opdracht 2 · Try-Out","versie":"Try-Out 2.1","decoder_url":"https://hanslefever.github.io/Decoder/","teams":{"A":{"naam":"Familie A · Camille & Jelle","vragen":[{"vraag":"Je wint €100.000. Wat doet Remy als eerste?","A":"Reizen","B":"Investeren","C":"Huis verbouwen","D":"Familie verwennen","correct":"C"},{"vraag":"Margaux is één dag onzichtbaar. Wat zou ze doen?","A":"Mensen observeren","B":"Grappen uithalen","C":"Op avontuur gaan","D":"Helemaal niets","correct":"A"},{"vraag":"Waaraan kan Remy het moeilijkst weerstaan?","A":"Dessert","B":"Koopjes","C":"Vakanties boeken","D":"Een uitdaging","correct":"A"},{"vraag":"Waar is Margaux opvallend goed in, zonder dat iedereen dat weet?","A":"Veel vlaggen van de wereld kennen","B":"Karting","C":"Data onthouden, zoals verjaardagen en gebeurtenissen","D":"Erg lenig zijn","correct":"C"},{"vraag":"Welke superkracht zou Remy kiezen?","A":"Vliegen","B":"Onzichtbaar zijn","C":"Gedachten lezen","D":"Tijd stilzetten","correct":"D"},{"vraag":"Wat wil Margaux in 2027 zeker kunnen?","A":"Een koersfiets kopen","B":"12 km lopen","C":"Haar PR op 5 km verbeteren","D":"Een verre reis maken","correct":"B"},{"vraag":"Remy krijgt onverwacht een vrije dag. Wat doet hij waarschijnlijk?","A":"Sporten","B":"Uitslapen","C":"Afspreken met vrienden","D":"Een klus afwerken","correct":"D"},{"vraag":"Waar krijgt Margaux energie van?","A":"Mensen","B":"Sport","C":"Uitdagingen","D":"Rust","correct":"D"},{"vraag":"Waar is Remy opvallend goed in, zonder dat iedereen dat weet?","A":"Veel vlaggen van de wereld kennen","B":"Data onthouden","C":"Karting","D":"Erg lenig zijn","correct":"A"},{"vraag":"Welke nieuwe hobby zou Margaux kiezen?","A":"Fotografie","B":"Duiken","C":"Schilderen","D":"Koken","correct":"C"},{"vraag":"Waar kan Remy echt niet tegen?","A":"Liegen","B":"Rommel en wanorde","C":"Dingen die over datum zijn","D":"Mensen die zagen en klagen over alle mogelijke onderwerpen","correct":"D"},{"vraag":"Vrijstelling voor zichzelf of €1.000 voor de groepspot: wat kiest Margaux?","A":"Vrijstelling","B":"€1.000 voor de groepspot","C":"Ze twijfelt tot het einde","D":"Afhankelijk van de situatie","correct":"B"},{"vraag":"Wat wil Remy in 2027 bereiken?","A":"12 km kunnen lopen","B":"Een koersfiets kopen","C":"Zijn PR op 5 km verbeteren","D":"Een verre reis maken","correct":"C"},{"vraag":"Wat bewondert Margaux bij anderen vooral?","A":"Humor","B":"Eerlijkheid","C":"Creativiteit","D":"Doorzettingsvermogen","correct":"D"},{"vraag":"Wat is Remy's grootste guilty pleasure?","A":"True Crime","B":"FC De Kampioenen kijken","C":"Snoep eten","D":"Vlogs kijken op YouTube","correct":"C"},{"vraag":"Van welke vakantie droomt Margaux het meest?","A":"Een strandvakantie","B":"Een roadtrip","C":"Een citytrip","D":"Een vakantie in de bergen","correct":"B"}]},"B":{"naam":"Familie B · Margaux & Remy","vragen":[{"vraag":"Waar heeft Jelle het meeste moeite mee?","A":"Verliezen","B":"Wachten","C":"Stilzitten","D":"Vroeg opstaan","correct":"A"},{"vraag":"Waar is Camille opvallend goed in, zonder dat iedereen dat weet?","A":"Karting","B":"Data onthouden","C":"Veel vlaggen van de wereld kennen","D":"Ze is erg elastisch/lenig","correct":"D"},{"vraag":"Je wint €100.000. Wat doet Jelle als eerste?","A":"Reizen","B":"Investeren","C":"Huis verbouwen","D":"Familie verwennen","correct":"A"},{"vraag":"Camille is één dag onzichtbaar. Wat zou ze doen?","A":"Mensen observeren","B":"Grappen uithalen","C":"Op avontuur gaan","D":"Helemaal niets","correct":"B"},{"vraag":"Waar is Jelle opvallend goed in, zonder dat iedereen dat weet?","A":"Data onthouden","B":"Karting","C":"Veel vlaggen van de wereld kennen","D":"Erg lenig zijn","correct":"B"},{"vraag":"Wat staat op Camille haar bucketlist voor 2027?","A":"Een verre reis, bijvoorbeeld opnieuw naar Zuid-Afrika","B":"12 km kunnen lopen","C":"Een koersfiets kopen","D":"Een PR op 5 km lopen","correct":"A"},{"vraag":"Welke vakantie kiest Jelle het liefst?","A":"Bergen","B":"Strand","C":"Rondreis","D":"Citytrip","correct":"B"},{"vraag":"Wat koopt Camille spontaan?","A":"Boeken","B":"Kleding","C":"Gadgets","D":"Lekker eten","correct":"B"},{"vraag":"Wat is Jelle's grootste guilty pleasure?","A":"FC De Kampioenen kijken","B":"True Crime","C":"Snoep eten","D":"Vlogs kijken op YouTube","correct":"A"},{"vraag":"Waar kan Camille echt niet tegen?","A":"Rommel en wanorde","B":"Liegen","C":"Dingen die over datum zijn","D":"Mensen die zagen en klagen","correct":"B"},{"vraag":"Aan welke soort opdracht zou Jelle het liefst deelnemen?","A":"Logica centraal staat","B":"Snelheid belangrijk is","C":"Samenwerking nodig is","D":"Durf gevraagd wordt","correct":"D"},{"vraag":"Je wint €100.000. Wat doet Camille als eerste?","A":"Reizen","B":"Investeren","C":"Huis verbouwen","D":"Familie verwennen","correct":"D"},{"vraag":"Wat staat op Jelle's bucketlist voor 2027?","A":"12 km kunnen lopen","B":"Een verre reis maken","C":"Een koersfiets kopen","D":"Een PR op 5 km lopen","correct":"C"},{"vraag":"Welke nieuwe hobby zou Camille kiezen?","A":"Fotografie","B":"Duiken","C":"Schilderen","D":"Koken","correct":"A"},{"vraag":"Jelle krijgt onverwacht een vrije dag. Wat doet hij waarschijnlijk?","A":"Sporten","B":"Uitslapen","C":"Afspreken met vrienden","D":"Een klus afwerken","correct":"B"},{"vraag":"Vrijstelling voor zichzelf of €1.000 voor de groepspot: wat kiest Camille?","A":"Vrijstelling","B":"€1.000 voor de groepspot","C":"Ze twijfelt tot het einde","D":"Afhankelijk van de situatie","correct":"B"}]}}};

/* ================= EINDE VRAGENBLOK ================= */

const params = new URLSearchParams(window.location.search);
const rawTeam = (params.get('team') || 'A').toLowerCase();
const teamAliases = {
  'a':'A','familiea':'A','familie-a':'A',
  'b':'B','familieb':'B','familie-b':'B'
};
const teamKey = teamAliases[rawTeam] || 'A';
const team = OPDRACHT.teams[teamKey] || OPDRACHT.teams.A;
let index = 0;

const countdown = document.getElementById('countdown');
const quiz = document.getElementById('quiz');
const finish = document.getElementById('finish');
const countNumber = document.getElementById('countNumber');
const brand = document.getElementById('brand');
const counter = document.getElementById('counter');
const bar = document.getElementById('bar');
const content = document.getElementById('content');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const relay = document.getElementById('relay');

brand.textContent = 'De Mol · ' + team.naam;

function show(screen) {
  countdown.classList.remove('active');
  quiz.classList.remove('active');
  finish.classList.remove('active');
  screen.classList.add('active');
}

function pulseNumber(value) {
  countNumber.textContent = value;
  countNumber.classList.remove('pulse');
  void countNumber.offsetWidth;
  countNumber.classList.add('pulse');
}

function feedback() {
  if ('vibrate' in navigator) navigator.vibrate(35);
  try {
    relay.pause();
    relay.currentTime = 0;
    relay.volume = 0.85;
    relay.play().catch(function() {});
  } catch (error) {}
}

function render(direction) {
  content.classList.add(direction > 0 ? 'fade-right' : 'fade-left');

  window.setTimeout(function() {
    const q = team.vragen[index];
    const letters = ['A','B','C','D'];

    content.innerHTML =
      '<div class="kicker">Vraag ' + (index + 1) + '</div>' +
      '<h1 class="question">' + q.vraag + '</h1>' +
      '<div class="options">' +
      letters.map(function(letter) {
        return '<div class="option"><span class="letter">' + letter +
          '</span><span>' + q[letter] + '</span></div>';
      }).join('') +
      '</div>';

    content.classList.remove('fade-left', 'fade-right');
    counter.textContent = (index + 1) + ' / ' + team.vragen.length;
    bar.style.width = ((index + 1) / team.vragen.length * 100) + '%';
    prev.disabled = index === 0;
    next.textContent = index === team.vragen.length - 1
      ? 'Naar eindscherm →'
      : 'Volgende →';
  }, 220);
}

prev.addEventListener('click', function() {
  if (index > 0) {
    feedback();
    index -= 1;
    render(-1);
  }
});

next.addEventListener('click', function() {
  feedback();
  if (index < team.vragen.length - 1) {
    index += 1;
    render(1);
  } else {
    show(finish);
  }
});

document.getElementById('back').addEventListener('click', function() {
  feedback();
  index = team.vragen.length - 1;
  show(quiz);
  render(-1);
});

document.getElementById('decoder').addEventListener('click', function() {
  feedback();
  const separator = OPDRACHT.decoder_url.includes('?') ? '&' : '?';
  window.location.href = OPDRACHT.decoder_url + separator + 'team=' + encodeURIComponent(teamKey);
});

function beginCountdown() {
  pulseNumber('3');

  window.setTimeout(function() {
    pulseNumber('2');

    window.setTimeout(function() {
      pulseNumber('1');

      window.setTimeout(function() {
        pulseNumber('START');

        window.setTimeout(function() {
          show(quiz);
          render(1);
        }, 650);
      }, 1000);
    }, 1000);
  }, 1000);
}

window.addEventListener('DOMContentLoaded', beginCountdown);
</script>
